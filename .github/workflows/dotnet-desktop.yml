# Intégration continue du client WPF : build et tests à chaque push / pull request
# sur main, puis mise à disposition de la build Release en artefact téléchargeable.
#
# La publication des releases est gérée séparément par release.yml (tags v*).

name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: AutomateDesign.sln
      App_Project_Path: IHM/IHM.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore $env:Solution_Name

    - name: Build
      run: dotnet build $env:Solution_Name --configuration ${{ matrix.configuration }} --no-restore

    - name: Execute unit tests
      run: dotnet test $env:Solution_Name --configuration ${{ matrix.configuration }} --no-build

    - name: Publish the WPF client
      if: matrix.configuration == 'Release'
      run: dotnet publish $env:App_Project_Path --configuration Release --output publish/AutomateDesign

    - name: Upload build artifacts
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: AutomateDesign
        path: publish/AutomateDesign
